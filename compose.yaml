services:
  db:
    image: postgres:16
    container_name: oficina-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: oficina_pass
    ports:
      - "5432:5432"
    volumes:
      - oficina_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mechanics-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/oficina_db
      SPRING_DATASOURCE_USERNAME: oficina_user
      SPRING_DATASOURCE_PASSWORD: oficina_pass
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    profiles:
      - quality
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  oficina_pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
