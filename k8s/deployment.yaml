apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanics-api
  labels:
    app: mechanics-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mechanics-api
  template:
    metadata:
      labels:
        app: mechanics-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mechanics-api
          # Substitua pela URL do ECR e pela tag do commit de uma NOVA imagem
          # que inclua o Actuator. Nao use uma imagem anterior a esta etapa.
          image: SUBSTITUA_PELO_REPOSITORIO_ECR:SUBSTITUA_PELA_TAG_DO_COMMIT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mechanics-api-config
            - secretRef:
                name: mechanics-api-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
