apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mechanics-api-aws
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      # Deve coincidir com aws_region do Terraform.
      region: us-east-1
      # Sem auth: o operador usa sua identidade via EKS Pod Identity.
