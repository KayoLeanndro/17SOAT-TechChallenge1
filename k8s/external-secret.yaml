apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mechanics-api
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mechanics-api-aws
    kind: SecretStore
  target:
    name: mechanics-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app: mechanics-api
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: mechanics-api/dev/application
        property: SPRING_DATASOURCE_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: mechanics-api/dev/application
        property: JWT_SECRET
